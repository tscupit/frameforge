name: Release validation (fork)

# FrameForge foundation: intentionally validate artifacts without publishing them.
# The upstream project published to PyPI, the MCP Registry, and GHCR under its own
# identity. Re-enable distribution only after FrameForge-specific package names,
# registries, credentials, and release procedures are deliberately configured.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and validate distributions (no publishing)
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: validated-distributions
          path: dist/
